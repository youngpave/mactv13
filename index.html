<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS Live Translation Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 10px;
        }

        /* Video Kapsayıcısı (Responsive & Modern Çerçeveli) */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Oranı */
            background: #131825;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Butonlar Alanı (Grid Düzeni) */
        .buttons-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Özel Kaydırma Çubuğu Tasarımı */
        .buttons-grid::-webkit-scrollbar {
            width: 6px;
        }
        .buttons-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .buttons-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* Modern Dil Butonları */
        .lang-btn {
            background: rgba(25, 32, 48, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: #b0c4de;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.2s ease;
            text-align: left;
        }

        .lang-btn:hover {
            background: rgba(40, 52, 78, 0.9);
            border-color: rgba(147, 112, 219, 0.5);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(147, 112, 219, 0.15);
        }

        /* Aktif / Seçili Buton Efekti */
        .lang-btn.active {
            background: linear-gradient(135deg, rgba(88, 28, 135, 0.4), rgba(49, 46, 129, 0.6));
            border-color: #a855f7;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .btn-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .lang-btn.active .btn-top {
            color: #e2e8f0;
        }

        .btn-name {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Ortadaki Video / Canlı Yayın Alanı -->
        <div class="video-wrapper">

    <script>
        function changeVideo(videoId, clickedButton) {
            document.querySelectorAll('.lang-btn').forEach(btn => {

            });
            clickedButton.classList.add('active');
        }
