<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Tam Sığdırılmış</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dış kapsayıcı: Videonun dikeyde duracağı yer */
        .video-box {
            width: 100%;
            /* 16:9 oranında bir alan açar */
            aspect-ratio: 16 / 9; 
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Iframe ayarları */
        iframe {
            position: absolute;
            /* Player'ın butonlarının görünmesi için ona geniş bir alan veriyoruz */
            width: 1000px; 
            height: 562px;
            border: none;
            /* Bu kısım sihirli dokunuş: Geniş player'ı telefonun genişliğine küçülterek sığdırır */
            transform: scale(calc(100vw / 1000));
            transform-origin: center center;
        }
    </style>
</head>
<body>

    <div class="video-box">
        <iframe 
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

</body>
</html>
