<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#player{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* ALT BAR */
.controls{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;

    padding:18px;

    box-sizing:border-box;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.92)
    );

    z-index:10;
}

/* MAVİ ÇİZGİ */
.progress{
    width:100%;

    height:5px;

    background:rgba(255,255,255,.2);

    border-radius:30px;

    overflow:hidden;

    position:relative;

    margin-bottom:15px;
}

.played{
    width:35%;

    height:100%;

    background:#0094ff;

    border-radius:30px;

    position:relative;
}

/* Beyaz nokta */
.played::after{
    content:'';

    position:absolute;

    right:-7px;

    top:50%;

    transform:translateY(-50%);

    width:14px;
    height:14px;

    border-radius:50%;

    background:white;
}

/* Alt ikonlar */
.bottom-controls{
    display:flex;

    align-items:center;

    justify-content:space-between;
}

/* Sol taraf */
.left-controls{
    display:flex;

    align-items:center;

    gap:18px;
}

/* Butonlar */
button{
    background:none;
    border:none;

    color:white;

    font-size:24px;

    cursor:pointer;
}

/* LIVE */
.live{
    color:white;

    font-size:15px;

    font-weight:bold;

    display:flex;

    align-items:center;

    gap:8px;
}

.dot{
    width:10px;
    height:10px;

    border-radius:50%;

    background:red;
}

/* Sağ ikon */
.right-controls{
    display:flex;

    align-items:center;

    gap:20px;
}

.icon{
    color:white;

    font-size:24px;

    cursor:pointer;
}
</style>
</head>

<body>

<div id="player">

<video
id="video"
autoplay
playsinline
></video>

<div class="controls">

<!-- MAVİ ÇİZGİ -->
<div class="progress">
<div class="played"></div>
</div>

<!-- ALT -->
<div class="bottom-controls">

<div class="left-controls">

<button id="play">
▶
</button>

<div class="live">
<div class="dot"></div>
LIVE
</div>

</div>

<div class="right-controls">

<div class="icon">
🔊
</div>

<div
class="icon"
id="fullscreen">
⛶
</div>

</div>

</div>

</div>

</div>

<script>

const video =
document.getElementById('video');

const playBtn =
document.getElementById('play');

const fullscreenBtn =
document.getElementById('fullscreen');

const source =
"https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8";

/* HLS */
if(Hls.isSupported()){

    const hls = new Hls({
        lowLatencyMode:true
    });

    hls.loadSource(source);

    hls.attachMedia(video);

    hls.on(
    Hls.Events.MANIFEST_PARSED,
    function(){

        video.play();
    });

}else if(
video.canPlayType(
'application/vnd.apple.mpegurl'
)){

    video.src = source;

    video.play();
}

/* PLAY */
playBtn.onclick = () => {

    if(video.paused){

        video.play();

        playBtn.innerHTML = "⏸";

    }else{

        video.pause();

        playBtn.innerHTML = "▶";
    }
};

/* FULLSCREEN */
fullscreenBtn.onclick = () => {

    if(document.fullscreenElement){

        document.exitFullscreen();

    }else{

        document.getElementById('player')
        .requestFullscreen();
    }
};

</script>

</body>
</html>
