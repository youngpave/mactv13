<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | Tam Sığdırma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ana Kapsayıcı */
        #video-container {
            flex: 1; /* Kalan tüm alanı doldur */
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        /* Iframe: Ekranı tamamen doldurması için zorlanan ayar */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover; /* Videoyu boşluk bırakmadan yayar */
        }

        /* Buton Alanı */
        .controls {
            height: 80px;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fs-btn {
            padding: 12px 40px;
            background: #f39c12;
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Tam ekrandayken butonu gizle ve videoyu her yere yay */
        :fullscreen #video-container { width: 100vw; height: 100vh; }
        :fullscreen .controls { display: none; }
    </style>
</head>
<body>

    <div id="video-container">
        <iframe 
            id="player"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="controls">
        <button class="fs-btn" onclick="goFull()">TAM EKRAN YAP</button>
    </div>

    <script>
        function goFull() {
            const container = document.getElementById('video-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                document.exitFullscreen();
            }
        }

        // Ekran yönü değiştiğinde videoyu yenile (bazı telefonlar için)
        window.addEventListener("orientationchange", function() {
            location.reload();
        });
    </script>

</body>
</html>
