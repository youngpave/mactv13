<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Tam Ekran Düzenlenmiş</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Video Kapsayıcı - Tam ekran yapılan yer burası */
        #video-box {
            width: 100%;
            aspect-ratio: 16 / 9; 
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Iframe: Başlangıçta gizli tutuyoruz, JS ile sığdıracağız */
        iframe {
            position: absolute;
            width: 1280px; 
            height: 720px;
            border: none;
            transform-origin: center center; /* Tam merkezden büyü */
            transition: transform 0.2s ease; /* Yumuşak geçiş */
        }

        .btn-fullscreen {
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="video-box">
        <iframe 
            id="main-iframe"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <button class="btn-fullscreen" onclick="goFull()">TAM EKRAN YAP</button>

    <script>
        const iframe = document.getElementById('main-iframe');
        const box = document.getElementById('video-box');

        // Videoyu ekrana sığdıran fonksiyon
        function scaleVideo() {
            // O anki genişliği al (Tam ekransa tüm ekranı, değilse sayfa genişliğini)
            let currentWidth = window.innerWidth;
            if (document.fullscreenElement) {
                currentWidth = screen.width;
            }
            
            // 1280px olan iframe'i mevcut genişliğe oranla
            const scaleAmount = currentWidth / 1280;
            iframe.style.transform = `scale(${scaleAmount})`;
        }

        // Sayfa yüklendiğinde ve boyut değiştiğinde çalıştır
        window.addEventListener('load', scaleVideo);
        window.addEventListener('resize', scaleVideo);

        function goFull() {
            if (box.requestFullscreen) {
                box.requestFullscreen();
            } else if (box.webkitRequestFullscreen) {
                box.webkitRequestFullscreen();
            }
            // Tam ekrana geçişten hemen sonra tekrar hesapla
            setTimeout(scaleVideo, 100);
        }

        // Tam ekrandan çıkınca/girince tetikle
        document.addEventListener('fullscreenchange', scaleVideo);
        document.addEventListener('webkitfullscreenchange', scaleVideo);
    </script>

</body>
</html>
