<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden; /* Dışarı taşan reklamları gizler */
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Kenarlara taşan reklamları maskeler */
            background-color: #000;
        }
        
        /* Iframe'i hafifçe büyütüp (zoom) kaydırarak köşedeki reklamları dışarı atıyoruz */
        iframe {
            position: absolute;
            top: -15px;    /* Üstteki reklamı yukarı itip gizler */
            left: -15px;   /* Soldaki reklamı sola itip gizler */
            width: calc(100% + 30px);  
            height: calc(100% + 30px); 
            border: none;
        }

        /* İlk tıklama reklamını yutan şeffaf kalkan */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Tıklama reklamı kalkanı -->
        <div id="clickShield" onclick="handleScreenClick()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCount = 0;

        function handleScreenClick() {
            clickCount++;
            var shield = document.getElementById('clickShield');
            
            if (clickCount === 1) {
                // İlk tıklamada zorunlu 1 reklamın geçilmesine izin verip kalkanı kaldırıyoruz
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.display = 'none';
                }, 300);
            }
        }

        // Sekme odak kaybı koruması
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
