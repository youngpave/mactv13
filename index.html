<video id="videoPlayer" controls autoplay playsinline style="width: 100%; height: 500px; background: #000; border-radius: 8px;"></video>

<!-- Hls.js Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  var video = document.getElementById('videoPlayer');
  var streamUrl = 'https://taraftarium24.one/api/proxy?u=http%3A%2F%2Fdenemelerle8.live%3A8080%2Flive%2F7XXYf18KaZ%2F189XDeCXMV%2F4603.m3u8&ch=ch_mu3erucn36d3f3';

  if (Hls.isSupported()) {
    var hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(function(error) {
        console.log("Otomatik oynatma tarayıcı tarafından engellendi:", error);
      });
    });
  } 
  // Safari ve iOS cihazlar için yerel destek
  else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
    video.addEventListener('loadedmetadata', function() {
      video.play();
    });
  }
</script>
