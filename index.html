<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Clappr Test</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/clappr/clappr-hlsjs-playback@latest/dist/clappr-hlsjs-playback.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
        #player { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="player"></div>

    <script>
        // Sayfa tamamen yüklendikten sonra oynatıcıyı kur
        window.onload = function() {
            var player = new Clappr.Player({
                source: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', // Bu çalışan test linki
                parentId: '#player',
                width: '100%',
                height: '100%',
                plugins: [HlsjsPlayback],
                autoPlay: true
            });
        };
    </script>
</body>
</html>
