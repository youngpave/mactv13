<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Mobil Uyumlu</title>
    <style>
        /* Sayfa ayarları */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Arka plan siyah kalsın */
            display: flex;
            flex-direction: column;
        }

        /* Videonun içinde duracağı kutu */
        .video-wrapper {
            position: relative;
            width: 100%;
            /* 16:9 oranını korumak için yükseklik otomatik hesaplanır */
            padding-top: 56.25%; 
            background: #000;
        }

        /* Iframe'i kutunun içine tam sığdır */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Yayın başlığı veya alt kısım için alan (Opsiyonel) */
        .content {
            padding: 15px;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <iframe 
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="content">
        <h3>Canlı Yayın İzleniyor...</h3>
        <p>Görüntü otomatik olarak genişliğe sığdırıldı.</p>
    </div>

</body>
</html>
