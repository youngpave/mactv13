<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nur'un Doğum Gününe Kalan Süre</title>
    <style>
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #880e4f;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h1 { margin-bottom: 20px; }
        #timer { font-size: 2.5rem; font-weight: bold; }
        .label { font-size: 1rem; color: #ad1457; }
    </style>
</head>
<body>

<div class="container">
    <h1>Nur'un Doğum Gününe Kalan Süre</h1>
    <div id="timer">Yükleniyor...</div>
</div>

<script>
    // 3 gün, 17 saat, 2 dakika
    let timeInSeconds = (3 * 24 * 3600) + (17 * 3600) + (2 * 60);

    function updateTimer() {
        const days = Math.floor(timeInSeconds / (24 * 3600));
        const hours = Math.floor((timeInSeconds % (24 * 3600)) / 3600);
        const minutes = Math.floor((timeInSeconds % 3600) / 60);
        const seconds = timeInSeconds % 60;

        document.getElementById('timer').innerHTML = 
            `${days}g ${hours}s ${minutes}d ${seconds}sn`;

        if (timeInSeconds > 0) {
            timeInSeconds--;
        } else {
            document.getElementById('timer').innerHTML = "İyi ki doğdun Nur! 🎉";
        }
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
