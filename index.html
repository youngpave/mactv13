<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | Orta Hizalı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sayfayı esnek bir kutu yap ve içeriği ortala */
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center; /* Yatayda ortala */
            align-items: center;    /* Dikeyde (yukarı-aşağı) ortala */
        }

        /* Player Kapsayıcısı */
        .player-wrapper {
            position: relative;
            width: 100%;
            /* 16:9 oranını korumak için */
            padding-top: 56.25%; 
            background: #000;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <iframe 
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

</body>
</html>
