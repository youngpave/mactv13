<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Nur'un Doğum Günü</title>
    <style>
        body { background: #fce4ec; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; }
        #timer { font-size: 2.5rem; color: #880e4f; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h1>Nur'un Doğum Gününe Kalan</h1>
    <div id="timer">Hesaplanıyor...</div>
</div>

<script>
    // 2 gün sonraki tarih ve saati buraya manuel girebilirsin:
    // Örn: new Date('2026-06-16T23:59:00')
    // Bugün 14 Haziran olduğuna göre 16 Haziran akşamını hedefliyoruz:
    const hedefTarih = new Date('2026-06-16T23:59:00').getTime();

    function update() {
        const simdi = new Date().getTime();
        const fark = hedefTarih - simdi;

        const gun = Math.floor(fark / (1000 * 60 * 60 * 24));
        const saat = Math.floor((fark % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const dakika = Math.floor((fark % (1000 * 60 * 60)) / (1000 * 60));
        const saniye = Math.floor((fark % (1000 * 60)) / 1000);

        document.getElementById('timer').innerHTML = 
            `${gun} gün, ${saat} saat, ${dakika} dk, ${saniye} sn`;
            
        if (fark < 0) {
            document.getElementById('timer').innerHTML = "İyi ki doğdun Nur! 🎉";
        }
    }

    setInterval(update, 1000);
    update();
</script>

</body>
</html>
