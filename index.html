<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Custom Live Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#player-container{
    position:relative;
    width:100%;
    height:100%;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* Alt kontrol bar */
.controls{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    background:linear-gradient(transparent, rgba(0,0,0,0.8));
    padding:15px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:15px;
}

/* Buton */
button{
    background:none;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* Progress */
.progress{
    flex:1;
    height:5px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:35%;
    height:100%;
    background:red;
}

/* LIVE */
.live{
    background:red;
    color:white;
    padding:4px 10px;
    border-radius:6px;
    font-size:14px;
    font-weight:bold;
}

/* Ses */
.volume{
    width:80px;
}

/* Fullscreen */
#fullscreen{
    font-size:20px;
}
</style>
</head>

<body>

<div id="player-container">

<video id="video" autoplay playsinline></video>

<div class="controls">

<button id="play">▶</button>

<div class="progress">
<div class="progress-bar"></div>
</div>

<div class="live">LIVE</div>

<input type="range" min="0" max="1" step="0.1" value="1" class="volume" id="volume">

<button id="fullscreen">⛶</button>

</div>

</div>

<script>
const video = document.getElementById('video');
const playBtn = document.getElementById('play');
const volume = document.getElementById('volume');
const fullscreen = document.getElementById('fullscreen');

const videoSrc = "https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8";

if(Hls.isSupported()){

    const hls = new Hls({
        lowLatencyMode:true
    });

    hls.loadSource(videoSrc);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,function(){
        video.play();
    });

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

    video.src = videoSrc;
    video.play();
}

/* Play Pause */
playBtn.onclick = () => {

    if(video.paused){
        video.play();
        playBtn.innerHTML = "⏸";
    }else{
        video.pause();
        playBtn.innerHTML = "▶";
    }
};

/* Ses */
volume.oninput = () => {
    video.volume = volume.value;
};

/* Fullscreen */
fullscreen.onclick = () => {

    if(document.fullscreenElement){
        document.exitFullscreen();
    }else{
        document.getElementById('player-container').requestFullscreen();
    }
};
</script>

</body>
</html>
