<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #player-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Kontrol İkonları */
        .controls {
            position: absolute; bottom: 20px; right: 20px;
            display: flex; gap: 15px; z-index: 20;
        }
        .btn {
            background: rgba(0,0,0,0.5); color: white; border: none;
            padding: 10px 15px; border-radius: 5px; cursor: pointer;
            font-size: 18px; transition: 0.3s;
        }
        .btn:hover { background: rgba(255,255,255,0.3); }

        /* Başlatma Overlay */
        #overlay {
            position: absolute; top:0; left:0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.4); z-index: 10; cursor: pointer;
        }
    </style>
</head>
<body>

<div id="player-container">
    <div id="overlay"><div>▶ OYNAT</div></div>
    
    <video id="video" playsinline></video>

    <div class="controls">
        <button class="btn" id="mute-btn">🔊 Ses</button>
        <button class="btn" id="fs-btn">⛶ Tam Ekran</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const muteBtn = document.getElementById('mute-btn');
    const fsBtn = document.getElementById('fs-btn');

    // Başlatma
    overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        const hls = new Hls();
        hls.loadSource('https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8');
        hls.attachMedia(video);
        video.play();
    });

    // Ses Kontrolü
    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerText = video.muted ? '🔇 Sessiz' : '🔊 Ses';
    });

    // Tam Ekran Kontrolü
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.getElementById('player-container').requestFullscreen();
            fsBtn.innerText = '⛶ Küçült';
        } else {
            document.exitFullscreen();
            fsBtn.innerText = '⛶ Tam Ekran';
        }
    });
</script>
</body>
</html>
