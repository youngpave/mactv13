<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | HD Yayın</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. Resimdeki gibi en üste yapışık ve tam genişlikte alan */
        #video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .button-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fs-btn {
            padding: 14px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Tam ekranda butonu sakla */
        :fullscreen .button-area { display: none; }
    </style>
</head>
<body>

    <div id="video-container">
        <iframe 
            id="match-player"
            src="https://wikisport.club/play/bein1tr0.php" 
            referrerpolicy="no-referrer"
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="button-area">
        <button class="fs-btn" onclick="goFull()">TAM EKRAN İZLE</button>
    </div>

    <script>
        function goFull() {
            const el = document.getElementById('video-container');
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
