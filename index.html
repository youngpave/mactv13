<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Akıllı Sığdırma</title>
    <style>
        /* Ekranı sıfırla */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #111;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* Player'ın içinde duracağı ana kutu */
        #video-container {
            position: relative;
            width: 95%; /* Kenarlardan çok az boşluk bırakır, daha şık durur */
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Iframe: İçeriği sığdırmak için geniş tutuyoruz */
        iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1280px; /* Standart HD genişlik */
            height: 720px; /* Standart HD yükseklik */
            border: none;
            /* Bu kısım player'ı kutunun içine küçülterek sığdırır */
            transform: translate(-50%, -50%) scale(calc(100% / 1280));
            transform-origin: center center;
        }

        /* Tam Ekran Butonu Stili */
        .controls {
            margin-top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .fs-button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .fs-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="video-container">
        <iframe 
            id="main-iframe"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="controls">
        <button class="fs-button" onclick="toggleFullScreen()">
            <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            TAM EKRAN YAP
        </button>
    </div>

    <script>
        function toggleFullScreen() {
            const container = document.getElementById('video-container');
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Tam ekran olduğunda iframe boyutunu otomatik ayarla (Bazı cihazlar için)
        document.addEventListener('fullscreenchange', () => {
            const iframe = document.getElementById('main-iframe');
            if (document.fullscreenElement) {
                iframe.style.transform = "translate(-50%, -50%) scale(" + (window.innerWidth / 1280) + ")";
            } else {
                // Normal moda dönünce eski ölçeğe dön
                iframe.style.transform = "translate(-50%, -50%) scale(calc(100% / 1280))";
            }
        });
    </script>

</body>
</html>
