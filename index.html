<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | Tam Sığdırılmış</title>
    <style>
        /* Sayfa sıfırlama */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 1. Resimdeki (1000018384.jpg) görüntüyü sağlayan kapsayıcı */
        #video-box {
            width: 100%; /* Telefonun genişliğini tam kapla */
            aspect-ratio: 16 / 9; /* Yayın oranını koru */
            position: relative;
            background: #000;
            margin-top: 0; /* En üste yapıştırır */
        }

        /* Iframe: Kapsayıcının içine tam yayılan ayar */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important; /* Genişliği zorla %100 yap */
            height: 100% !important; /* Yüksekliği kapsayıcıya göre ayarla */
            border: none;
        }

        /* Buton alanı */
        .controls {
            flex: 1; /* Kalan alanı kapla */
            display: flex;
            justify-content: center;
            align-items: center; /* Butonu dikeyde ortalar */
        }

        .fs-btn {
            padding: 15px 35px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        /* Tam ekrana geçildiğinde butonu gizle */
        :fullscreen .controls { display: none; }
        :-webkit-full-screen .controls { display: none; }
    </style>
</head>
<body>

    <div id="video-box">
        <iframe 
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="controls">
        <button class="fs-btn" onclick="openFull()">TAM EKRAN YAP</button>
    </div>

    <script>
        function openFull() {
            const videoBox = document.getElementById('video-box');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (videoBox.requestFullscreen) {
                    videoBox.requestFullscreen();
                } else if (videoBox.webkitRequestFullscreen) {
                    videoBox.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
