<!DOCTYPE html>
<html lang="tr">
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #player-container { position: relative; width: 100vw; height: 100vh; }
        
        video { width: 100%; height: 100%; object-fit: cover; }

        /* Başlatma ve Yükleme Katmanı */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 10;
        }

        /* Oynat İkonu */
        #play-btn {
            font-size: 80px; color: white;
            border: 2px solid white; border-radius: 50%;
            padding: 20px 30px; transition: 0.3s;
        }
        #play-btn:hover { background: white; color: black; }

        /* Yükleme Animasyonu */
        .loader {
            border: 8px solid #f3f3f3; border-top: 8px solid #3498db;
            border-radius: 50%; width: 60px; height: 60px;
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="player-container">
    <div id="overlay">
        <div id="play-btn">▶</div>
        <div id="loader" class="loader"></div>
    </div>
    <video id="video" playsinline></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const playBtn = document.getElementById('play-btn');
    const loader = document.getElementById('loader');
    const videoSrc = 'https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8';

    overlay.addEventListener('click', () => {
        playBtn.style.display = 'none';
        loader.style.display = 'block';
        
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().then(() => {
                overlay.style.display = 'none';
            });
        });
    });
</script>

</body>
</html>
