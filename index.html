
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<div id="player">

    <video id="video" autoplay playsinline></video>

    <!-- ÜST -->
    <div class="top-bar">
        <div class="live-box">
            <span class="dot"></span>
            LIVE
        </div>
    </div>

    <!-- ALT -->
    <div class="controls">

        <button id="play">▶</button>

        <div class="progress">
            <div class="buffer"></div>
            <div class="played"></div>
        </div>

        <div class="time">
            LIVE
        </div>

        <button id="fullscreen">⛶</button>

    </div>

</div>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#player{
    position:relative;
    width:100%;
    height:100vh;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

/* ÜST */
.top-bar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:15px;
    box-sizing:border-box;
    z-index:10;

    background:linear-gradient(
        rgba(0,0,0,.7),
        transparent
    );
}

/* LIVE */
.live-box{
    display:inline-flex;
    align-items:center;
    gap:8px;

    background:rgba(0,0,0,.6);

    color:white;

    padding:8px 14px;

    border-radius:30px;

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;
}

.dot{
    width:10px;
    height:10px;
    background:red;
    border-radius:50%;
}

/* ALT BAR */
.controls{
    position:absolute;

    bottom:0;
    left:0;

    width:100%;

    padding:14px;

    box-sizing:border-box;

    display:flex;

    align-items:center;

    gap:15px;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );

    z-index:10;
}

/* Buton */
button{
    background:none;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
}

/* ÇİZGİ */
.progress{
    flex:1;
    height:5px;

    background:rgba(255,255,255,.2);

    border-radius:30px;

    overflow:hidden;

    position:relative;
}

/* Buffer */
.buffer{
    position:absolute;

    width:70%;
    height:100%;

    background:rgba(255,255,255,.25);
}

/* Oynayan çizgi */
.played{
    position:absolute;

    width:35%;
    height:100%;

    background:#00a2ff;

    border-radius:30px;
}

/* Süre */
.time{
    color:white;
    font-size:14px;
}

/* Hover efekti */
.controls{
    transition:.3s;
}

#player:hover .controls{
    opacity:1;
}
</style>

<script>
const video = document.getElementById('video');

const playBtn = document.getElementById('play');

const fullscreenBtn =
document.getElementById('fullscreen');

const source =
"https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8";

/* HLS */
if(Hls.isSupported()){

    const hls = new Hls({
        lowLatencyMode:true
    });

    hls.loadSource(source);

    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED,
    function(){

        video.play();
    });

}else if(
video.canPlayType(
'application/vnd.apple.mpegurl'
)){

    video.src = source;

    video.play();
}

/* PLAY */
playBtn.onclick = () => {

    if(video.paused){

        video.play();

        playBtn.innerHTML = "⏸";

    }else{

        video.pause();

        playBtn.innerHTML = "▶";
    }
};

/* FULLSCREEN */
fullscreenBtn.onclick = () => {

    if(document.fullscreenElement){

        document.exitFullscreen();

    }else{

        document.getElementById('player')
        .requestFullscreen();
    }
};
</script>
