<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Gerçek Tam Ekran</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Video Kapsayıcı */
        #video-container {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Iframe: JS ile dinamik olarak boyutlandırılacak */
        iframe {
            position: absolute;
            width: 1280px; 
            height: 720px;
            border: none;
            transform-origin: center center;
        }

        /* Buton Stili */
        .btn-zone {
            margin-top: 20px;
        }
        .fs-btn {
            padding: 15px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <iframe 
            id="stream-iframe"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="btn-zone">
        <button class="fs-btn" onclick="toggleFullScreen()">TAM EKRAN YAP / ÇIK</button>
    </div>

    <script>
        const iframe = document.getElementById('stream-iframe');
        const container = document.getElementById('video-container');

        // BU FONKSİYON VİDEOYU EKRANA SIFIRLAR
        function adjustVideoScale() {
            // Kapsayıcının o anki genişliğini al
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;

            // 1280x720'ye göre oranı hesapla
            const scaleX = containerWidth / 1280;
            const scaleY = containerHeight / 720;

            // Hem genişlik hem yükseklik için en uygun oranı seç
            const finalScale = Math.max(scaleX, scaleY);

            iframe.style.transform = `scale(${finalScale})`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Ekran boyutu her değiştiğinde veya tam ekrana girip çıkıldığında sığdır
        window.addEventListener('resize', adjustVideoScale);
        document.addEventListener('fullscreenchange', () => {
            // Tam ekrana geçiş animasyonu için kısa bir gecikme ekliyoruz
            setTimeout(adjustVideoScale, 300);
        });
        document.addEventListener('webkitfullscreenchange', () => {
            setTimeout(adjustVideoScale, 300);
        });

        // Sayfa ilk açıldığında çalıştır
        adjustVideoScale();
    </script>

</body>
</html>
