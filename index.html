<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Kesin Çözüm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%; height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Video Kutusu */
        #video-container {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        /* Iframe: Başlangıçta HD boyutunda ama esnek */
        iframe {
            border: none;
            position: absolute;
            width: 1280px; 
            height: 720px;
            transform-origin: center center;
        }

        /* Alt Buton Alanı */
        .ui-controls {
            position: fixed;
            bottom: 30px;
            z-index: 999;
        }

        .fs-btn {
            padding: 15px 35px;
            background: #e67e22; /* Turuncu dikkat çekici buton */
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        /* Tam ekrandayken butonu gizle (isteğe bağlı) */
        :fullscreen .ui-controls { display: none; }
    </style>
</head>
<body>

    <div id="video-container">
        <iframe 
            id="player-frame"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="ui-controls">
        <button class="fs-btn" onclick="toggleFull()">TAM EKRAN MODU</button>
    </div>

    <script>
        const iframe = document.getElementById('player-frame');
        const container = document.getElementById('video-container');

        function fixVideoSize() {
            const screenW = container.clientWidth;
            const screenH = container.clientHeight;

            // Ekran oranına göre ölçeği hesapla
            const ratioX = screenW / 1280;
            const ratioY = screenH / 720;

            // Videoyu bozmadan sığdır (Contain mantığı)
            let finalScale = Math.min(ratioX, ratioY);
            
            // Eğer tam ekrandaysan ve telefon dikse, genişliğe zorla
            if (screenH > screenW) {
                finalScale = ratioX;
            }

            iframe.style.transform = `scale(${finalScale})`;
        }

        function toggleFull() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) { container.requestFullscreen(); }
                else if (container.webkitRequestFullscreen) { container.webkitRequestFullscreen(); }
            } else {
                document.exitFullscreen();
            }
        }

        // Her durumda videoyu yeniden hesapla
        window.addEventListener('resize', () => {
            setTimeout(fixVideoSize, 200);
        });

        document.addEventListener('fullscreenchange', () => {
            setTimeout(fixVideoSize, 300);
        });

        // İlk açılış
        window.onload = fixVideoSize;
    </script>

</body>
</html>
