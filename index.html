<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Yayın Sandbox Oynatıcı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid #334155;
        }
        .header {
            padding: 16px 20px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 600;
        }
        .badge {
            background: #0284c7;
            color: white;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 9999px;
            font-weight: 500;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .footer {
            padding: 12px 20px;
            font-size: 0.85rem;
            color: #94a3b8;
            text-align: center;
            background: #1e293b;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Bein Sports 1 - Canlı Yayın Sandbox</h1>
            <span class="badge">Sandbox Aktif</span>
        </div>
        
        <div class="player-wrapper">
            <!-- Sandbox özellikleri: scripts, forms, same-origin izinleri verilmiş, pop-up ve harici yönlendirmeler kısıtlanmıştır -->
            <iframe 
                src="https://tvnow247.top/embed-stream/bein-sports-1-turkey" 
                sandbox="allow-scripts allow-same-origin allow-presentation allow-autoplay"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer">
            Eğer ev internetinde (Superonline) donma yaşanırsa, mobil veri veya tünel proxy desteği gerekebilir.
        </div>
    </div>

</body>
</html>
