<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maç TV | Canlı Yayın</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
        }

        /* Iframe boyutlarını CSS ile kilitliyoruz */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe 
            id="yayin-frame"
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <script>
        // JavaScript Bekçisi: Her 1 saniyede bir boyutları kontrol eder
        setInterval(function() {
            var frame = document.getElementById('yayin-frame');
            if (frame) {
                // Eğer bir script boyutları değiştirdiyse, zorla geri yükle
                if (frame.style.width !== "100%" || frame.parentElement.style.height !== "100vh") {
                    frame.style.setProperty('width', '100%', 'important');
                    frame.style.setProperty('height', '100%', 'important');
                    console.log("Boyut müdahalesi engellendi! 🛡️");
                }
            }
        }, 1000); 

        // Ekranın kapanmasını önlemek için basit bir "uyandırma" fonksiyonu
        window.addEventListener('click', function() {
            console.log("Yayın aktif tutuluyor...");
        });
    </script>

</body>
</html>
