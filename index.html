<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | Entegre Player</title>
    <style>
        /* Ekrandaki tüm varsayılan boşlukları sıfırla */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow-x: hidden; /* Sağa sola kaymayı engelle */
        }

        /* Player'ı içine gömeceğimiz ana kapsayıcı */
        .player-wrapper {
            position: relative;
            width: 100%;
            /* 16:9 yayın oranını korur, player'ı buna zorlar */
            padding-top: 56.25%; 
            background: #000;
        }

        /* Iframe'i bu kutunun içine tam olarak sığdırıyoruz */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            /* Player içindeki tam ekran butonunun çalışması için şart: */
            allowfullscreen: true;
        }

        /* Sayfanın geri kalan kısmını doldurmak istersen (isteğe bağlı) */
        .info-area {
            padding: 20px;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <iframe 
            src="https://streamsgate.click/tv/tv-33.php" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <div class="info-area">
        <p style="font-size: 14px; color: #888;">Yayın otomatik olarak sığdırıldı.</p>
        <p style="margin-top: 10px;">Player üzerindeki butonları kullanabilirsiniz.</p>
    </div>

</body>
</html>
