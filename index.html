<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Maç TV | Canlı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; 
            background-color: #000; 
            overflow: hidden;
        }

        /* Iframe'i tam olarak ekran boyutuna zorla */
        .player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Bazı playerların üstte boşluk bırakmasını engellemek için */
            display: block;
        }

        /* Sayfanın üzerine binen her şeyi engelle */
        #ui-fixer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            pointer-events: none; /* Tıklamayı arka plana (iframe'e) geçirir */
        }
    </style>
</head>
<body>

    <div id="ui-fixer"></div>

    <div class="player-container" id="video-area">
        <iframe 
            id="stream-frame"
            src="https://dlstreams.com/cast/stream-62.php" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen 
            scrolling="no">
        </iframe>
    </div>

    <script>
        // Sayfa tıklandığında GERÇEK tam ekranı değil, 
        // player'ın içindeki butonun çalışması için gerekli izni veriyoruz
        document.addEventListener('click', function() {
            const frame = document.getElementById('stream-frame');
            // Iframe'e odaklanmasını sağla
            frame.focus();
        }, {once: true});
    </script>

</body>
</html>
