<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        
        #player-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Başlatma Ekranı */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            color: white;
            font-size: 50px;
        }

        /* Butonların olduğu kutu (Sağ alt) */
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px); /* Modern cam efekti */
        }

        .btn:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body>

<div id="player-container">
    <!-- Başlatma butonu -->
    <div id="overlay">▶ OYNAT</div>
    
    <video id="video" playsinline></video>

    <!-- Kontrol butonları -->
    <div class="controls">
        <button class="btn" id="mute-btn">SES AÇ/KAPAT</button>
        <button class="btn" id="fs-btn">TAM EKRAN</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const muteBtn = document.getElementById('mute-btn');
    const fsBtn = document.getElementById('fs-btn');
    const container = document.getElementById('player-container');

    // Oynatıcıyı başlat
    overlay.addEventListener('click', () => {
        overlay.style.display = 'none';
        const hls = new Hls();
        hls.loadSource('https://deneme-1-d0w5.onrender.com/proxy/m3u?url=http://vip-flying.xyz:2095/live/hs2254tv/hs2209dd00/104267.m3u8'); // Yayın linkin buraya
        hls.attachMedia(video);
        video.play();
    });

    // Ses Kontrolü
    muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerText = video.muted ? 'SES AÇ' : 'SESSİZ';
    });

    // Tam Ekran
    fsBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            container.requestFullscreen();
            fsBtn.innerText = 'KÜÇÜLT';
        } else {
            document.exitFullscreen();
            fsBtn.innerText = 'TAM EKRAN';
        }
    });
</script>
</body>
</html>
