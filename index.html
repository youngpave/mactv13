<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCIPTV Web Player</title>
    
    <!-- Clappr Player Kütüphanesi -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <!-- Google Cast SDK (Zorunlu) -->
    <script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <!-- Clappr Chromecast Eklentisi -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-chromecast-plugin@latest/dist/clappr-chromecast-plugin.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            background-color: #0f1015; /* XCIPTV koyu arayüz arka planı */
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Üst Bilgi Barı (XCIPTV Tarzı) */
        .xciptv-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 0 20px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            pointer-events: none;
        }
        .xciptv-header span {
            color: #e50914;
            margin-right: 8px;
        }
        #player {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Üst Başlık Alanı -->
    <div class="xciptv-header">
        <span>■</span> CANLI YAYIN - XCIPTV WEB
    </div>

    <div id="player"></div>

    <script>
        window.onload = function() {
            var player = new Clappr.Player({
                source: "https://proxy.codenet.lol/live/A9A74EDC2AC55530B4D98B43C56B7908/25.m3u8",
                plugins: [ChromecastPlugin],
                autoplay: true,
                width: "100%",
                height: "100%",
                chromecast: {
                    appId: "CC1AD845",
                    media: {
                        type: ChromecastPlugin.Movie,
                        title: "Canlı Yayın",
                    }
                }
            });
        };
    </script>
</body>
</html>
